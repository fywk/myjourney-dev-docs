<div
  class="preview not-prose relative overflow-x-auto border border-b-0 border-gray-300 transition-colors duration-300 dark:border-gray-700"
  data-preview-theme="system"
>
  <button
    type="button"
    class="c-button absolute top-2.5 right-2.5 aspect-square px-0"
    data-variant="subtle"
    data-size="sm"
    data-focus-outline="true"
    data-pill="false"
    aria-label="Toggle preview theme"
    data-preview-toggle
    aria-pressed="false"
  >
    <span
      class="hidden in-data-[preview-theme=system]:inline"
    >
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10" />
        <path d="M7 20h10" />
        <path d="M9 16v4" />
        <path d="M15 16v4" />
      </svg>
    </span>
    <span class="hidden in-data-[preview-theme=light]:inline">
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
        <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
      </svg>
    </span>
    <span class="hidden in-data-[preview-theme=dark]:inline">
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" />
      </svg>
    </span>
  </button>
  <div
    class="flex min-h-40 min-w-max items-center justify-center gap-4 p-8 transition-colors duration-300 in-data-[preview-theme=dark]:bg-gray-900 in-data-[preview-theme=light]:bg-gray-100"
  >
    {{ .Inner | safeHTML }}
  </div>
</div>
