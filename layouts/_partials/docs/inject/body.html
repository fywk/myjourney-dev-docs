{{- if and .IsPage (eq .Type "docs") }}
  <script>
    (() => {
      const mq = matchMedia("(prefers-color-scheme: dark)");
      let inverted = false;

      const apply = () => {
        const theme = inverted ? (mq.matches ? "light" : "dark") : "system";
        document.querySelectorAll("[data-preview-theme]").forEach((el) => {
          el.setAttribute("data-preview-theme", theme);
        });
        document.querySelectorAll("[data-preview-toggle]").forEach((btn) => {
          btn.setAttribute("aria-pressed", inverted);
        });
      };

      document.addEventListener("click", (e) => {
        if (!e.target.closest("[data-preview-toggle]")) return;
        inverted = !inverted;
        apply();
      });

      mq.addEventListener("change", apply);
    })();
  </script>
{{- end }}
